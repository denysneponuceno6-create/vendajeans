# ============================================================
# Render — serviço web + banco PostgreSQL
# Nenhum valor real de segredo entra neste arquivo.
# ============================================================
databases:
  - name: loja-do-jeans-db
    databaseName: lojajeans
    user: lojajeans
    plan: free

services:
  - type: web
    name: central-loja-do-jeans
    env: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: loja-do-jeans-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true          # obrigatório: sem ele o servidor não sobe em produção
      - key: ADMIN_USER
        value: admin
      - key: ADMIN_PASS
        sync: false                  # defina no painel do Render, nunca aqui
      - key: SITE_ORIGIN
        sync: false                  # ex.: https://sualoja.github.io
      # --- integrações: deixe vazias até ter as credenciais ---
      - key: META_ACCESS_TOKEN
        sync: false
      - key: META_APP_ID
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: IG_BUSINESS_ID
        sync: false
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_ID
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: RETENCAO_EVENTOS_DIAS
        value: "400"
